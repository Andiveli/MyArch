[window]
opacity = 0.4
blur = true
decorations = "full"         # O "none" si quieres ocultar la barra de título
padding = { x = 10, y = 10 }
dynamic_padding = true

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

# Alacritty suele activar ligaduras automáticamente. 
# Si necesitas características específicas, usa 'features':
# features = ["+liga", "+calt"] 

[colors.primary]
background = "#000000"
foreground = "#f3f6f9"

[colors.cursor]
text = "#000000"
cursor = "#e0c15a"

[colors.selection]
text = "#f3f6f9"
background = "#263356"

[colors.normal]
black = "#06080f"
red = "#cb7c94"
green = "#b7cc85"
yellow = "#ffe066"
blue = "#7fb4ca"
magenta = "#ff8dd7"
cyan = "#7aa89f"
white = "#f3f6f9"

[colors.bright]
black = "#8a8fa3"
red = "#de8fa8"
green = "#d1e8a9"
yellow = "#fff7b1"
blue = "#a3d4d5"
magenta = "#ffaeea"
cyan = "#7fb4ca"    # Nota: En tu config original bright cyan repetía el color 4
white = "#f3f6f9"

[keyboard]
# Mapeo básico para simular el shift+enter de tu config
bindings = [{ key = "Enter", mods = "Shift", chars = "\u001b\r" }]
