# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Floating window
bind -n M-f if -F '#{||:#{==:#{session_name},scratch},#{||:#{==:#{session_name},dev-run},#{==:#{session_name},front-run}}}' {
    detach-client
} {
  if -F '#{==:#{session_name},DEV}' {
    display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s dev-run"
  } {
    if -F '#{==:#{session_name},Front}' {
      display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s front-run"
    } {
      display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
    }
  }
}

# Tema Kanagawa
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'Kanagawa'
set -g @kanagawa-plugins "ram-usage"
set -g @kanagawa-ignore-window-colors true

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -s extended-keys off

# Modo vim
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# Keymaps
unbind C-b
set -g prefix C-g
bind C-g send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"


# Cambiar entre ventanas (tabs) con Alt+h / Alt+l
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-v copy-mode

# Mouse support
set -g mouse on

# Status bar position
set -g status-position top

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'

# tmux agent-state notifier — sourced last so the per-tab dot extends the theme
if-shell '[ -f ~/.config/tmux/agents.conf ]' 'source-file ~/.config/tmux/agents.conf'
