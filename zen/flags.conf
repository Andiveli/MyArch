# Zen browser flags
# NOTA: Zen es un fork de Firefox. Las flags --ozone, --use-gl, --enable-features,
# --enable-gpu-rasterization, --ignore-gpu-blocklist, etc. son flags de Chromium.
# Firefox las ignora completamente. Las dejamos comentadas como referencia.
#
# Lo único que importa para Wayland/perf son las env vars en launch.sh:
#   MOZ_ENABLE_WAYLAND=1  (obliga Wayland nativo)
#   GDK_BACKEND=wayland   (consistencia)
# Y los prefs en user.js.
#
# Si en el futuro Zen migra a Chromium, descomentar lo de abajo. Por ahora, no hace nada.

# --- Chromium flags (no aplican a Firefox) ---
# --ozone-platform=wayland
# --use-gl=egl
# --use-angle=gl-egl
# --enable-gpu-rasterization
# --enable-zero-copy
# --ignore-gpu-blocklist
# --enable-features=VaapiVideoDecodeLinuxGL,VaapiIgnoreDriverChecks,AcceleratedSmallCanvases,CanvasOopRasterization
